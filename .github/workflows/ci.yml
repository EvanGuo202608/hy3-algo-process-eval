name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Install document dependencies
        run: python3 -m pip install python-docx reportlab
      - name: Validate catalog
        run: python3 scripts/validate_problem_catalog.py
      - name: Reproduce A01, A02, B01, B02, C01, C02, and D01 reference solutions
        run: |
          python3 scripts/reproduce_problem.py --problem A01-pack-cost
          python3 scripts/reproduce_problem.py --problem A02-interval-removal
          python3 scripts/reproduce_problem.py --problem B01-pairing
          python3 scripts/reproduce_problem.py --problem B02-cut-height
          python3 scripts/reproduce_problem.py --problem C01-rising-points
          python3 scripts/reproduce_problem.py --problem C02-minimum-network
          python3 scripts/reproduce_problem.py --problem D01-range-add-sum
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -q
      - name: Run A01 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem A01-pack-cost
      - name: Run A02 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem A02-interval-removal --fixture fixtures/a02_interval_removal/wrong_process_right_code.json
      - name: Run B01 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem B01-pairing --fixture fixtures/b01_pairing/wrong_process_right_code.json
      - name: Run B02 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem B02-cut-height --fixture fixtures/b02_cut_height/wrong_process_right_code.json
      - name: Run C01 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem C01-rising-points --fixture fixtures/c01_rising_points/wrong_process_right_code.json
      - name: Run C02 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem C02-minimum-network --fixture fixtures/c02_minimum_network/wrong_process_right_code.json
      - name: Run D01 demo
        run: PYTHONPATH=src python3 -m algotrace_hy3 demo --problem D01-range-add-sum --fixture fixtures/d01_range_add_sum/wrong_process_right_code.json
      - name: Build acceptance documents
        run: python3 scripts/build_acceptance_docs.py
